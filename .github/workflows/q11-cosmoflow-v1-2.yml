name: Q11 CosmoFlow V1.2 Blind Competition

on:
  push:
    branches:
      - q11-cosmoflow-v1
    paths:
      - 'Q11_COSMOFLOW_V1_2_PREREGISTRATION.md'
      - 'q11_cosmoflow/run_v1_2.py'
      - '.github/workflows/q11-cosmoflow-v1-2.yml'
      - 'q11_cosmoflow/run_v1_1.py'
      - 'q11_cosmoflow/requirements-v1.1.txt'
      - 'CosmoFlow/Massless_dphi3/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Q11_COSMOFLOW_V1_2_PREREGISTRATION.md'
      - 'q11_cosmoflow/run_v1_2.py'
      - '.github/workflows/q11-cosmoflow-v1-2.yml'
      - 'q11_cosmoflow/run_v1_1.py'
      - 'q11_cosmoflow/requirements-v1.1.txt'
      - 'CosmoFlow/Massless_dphi3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-competition:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.8.18
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.18'
          cache: 'pip'
          cache-dependency-path: q11_cosmoflow/requirements-v1.1.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade 'pip<25'
          pip install -r q11_cosmoflow/requirements-v1.1.txt
          pip freeze | sort > q11_cosmoflow/environment-freeze-v1.2.txt

      - name: Execute preregistered V1.2 blind competition
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p q11_cosmoflow/artifacts/v1.2
          set -o pipefail
          python q11_cosmoflow/run_v1_2.py | tee q11_cosmoflow/artifacts/v1.2/run.log

      - name: SHA256 freeze
        run: |
          cd q11_cosmoflow/artifacts/v1.2
          sha256sum raw_baseline.npz features.json family_registry.json scores.csv result.json run.log | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload V1.2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: q11-cosmoflow-v1-2-blind-competition
          path: |
            q11_cosmoflow/artifacts/v1.2/**
            q11_cosmoflow/environment-freeze-v1.2.txt
            Q11_COSMOFLOW_V1_2_PREREGISTRATION.md
          if-no-files-found: error
          retention-days: 90
