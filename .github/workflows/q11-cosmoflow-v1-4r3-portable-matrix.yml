name: Q11 CosmoFlow V1.4R3 Portable Gate Matrix

on:
  push:
    branches: [q11-cosmoflow-v1]
    paths:
      - '.github/workflows/q11-cosmoflow-v1-4r3-portable-matrix.yml'
      - 'Q11_COSMOFLOW_V1_4R3_PREREGISTRATION.md'
      - 'q11_forensics/run_v1_4r3_portable_gate.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/q11-cosmoflow-v1-4r3-portable-matrix.yml'
      - 'Q11_COSMOFLOW_V1_4R3_PREREGISTRATION.md'
      - 'q11_forensics/run_v1_4r3_portable_gate.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  portable-matrix:
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2, 3, 4]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.18'
          cache: pip
          cache-dependency-path: q11_cosmoflow/requirements-v1.1.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade 'pip<25'
          pip install -r q11_cosmoflow/requirements-v1.1.txt
      - name: Fetch canonical V1.1R reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p q11_forensics/reference_v1.1r
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9437578374/zip" \
            -o /tmp/q11-v1.1r-reference.zip
          unzip -q /tmp/q11-v1.1r-reference.zip -d q11_forensics/reference_v1.1r
          echo "b3247d19e54dda0652b77649e2c5826ed44b5c633ad8a6d15b0e96319eec84e1  q11_forensics/reference_v1.1r/artifacts/v1.1/raw_baseline.npz" | sha256sum -c -
      - name: Run portable gate
        env:
          MPLBACKEND: Agg
          Q11_REFERENCE_NPZ: ${{ github.workspace }}/q11_forensics/reference_v1.1r/artifacts/v1.1/raw_baseline.npz
        run: |
          set -o pipefail
          python q11_forensics/run_v1_4r3_portable_gate.py | tee q11_forensics/v1.4r3-matrix-${{ matrix.replicate }}.log
          grep -m1 'model name' /proc/cpuinfo > q11_forensics/cpu-${{ matrix.replicate }}.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: q11-cosmoflow-v1-4r3-matrix-${{ matrix.replicate }}
          path: |
            q11_forensics/artifacts/v1.4r3/portable_gate_report.json
            q11_forensics/v1.4r3-matrix-${{ matrix.replicate }}.log
            q11_forensics/cpu-${{ matrix.replicate }}.txt
            q11_cosmoflow/artifacts/v1.1/raw_baseline.npz
          if-no-files-found: error
          retention-days: 90
