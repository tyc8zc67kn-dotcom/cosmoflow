name: Q11 CosmoFlow V1.4R4 Durable Portable Gate

on:
  push:
    branches: [q11-cosmoflow-v1]
    paths:
      - 'Q11_COSMOFLOW_V1_4R4_PREREGISTRATION.md'
      - 'q11_forensics/reference/v1.1r_payload.part*'
      - 'q11_forensics/run_v1_4r4_durable_gate.py'
      - '.github/workflows/q11-cosmoflow-v1-4r4-durable-gate.yml'
      - 'q11_cosmoflow/run_v1_1.py'
      - 'q11_cosmoflow/requirements-v1.1.txt'
      - 'CosmoFlow/Massless_dphi3/**'
  pull_request:
    branches: [main]
    paths:
      - 'Q11_COSMOFLOW_V1_4R4_PREREGISTRATION.md'
      - 'q11_forensics/reference/v1.1r_payload.part*'
      - 'q11_forensics/run_v1_4r4_durable_gate.py'
      - '.github/workflows/q11-cosmoflow-v1-4r4-durable-gate.yml'
      - 'q11_cosmoflow/run_v1_1.py'
      - 'q11_cosmoflow/requirements-v1.1.txt'
      - 'CosmoFlow/Massless_dphi3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-portable-gate:
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2, 3, 4]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository-backed canonical reference
        uses: actions/checkout@v4

      - name: Setup Python 3.8.18
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.18'
          cache: pip
          cache-dependency-path: q11_cosmoflow/requirements-v1.1.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade 'pip<25'
          pip install -r q11_cosmoflow/requirements-v1.1.txt
          mkdir -p q11_forensics/artifacts/v1.4r4
          pip freeze | sort > q11_forensics/artifacts/v1.4r4/environment-freeze.txt

      - name: Verify durable reference package and execute gate
        env:
          MPLBACKEND: Agg
        run: |
          set -o pipefail
          python q11_forensics/run_v1_4r4_durable_gate.py | tee q11_forensics/artifacts/v1.4r4/run.log

      - name: Freeze V1.4R4 evidence
        run: |
          sha256sum \
            q11_forensics/reference/v1.1r_payload.part1 \
            q11_forensics/reference/v1.1r_payload.part2 \
            q11_forensics/reference/v1.1r_payload.part3 \
            q11_forensics/reference/v1.1r_payload.part4 \
            q11_forensics/artifacts/v1.4r4/durable_gate_report.json \
            q11_forensics/artifacts/v1.4r4/environment-freeze.txt \
            q11_forensics/artifacts/v1.4r4/run.log \
            q11_cosmoflow/artifacts/v1.1/raw_baseline.npz \
            | sort > q11_forensics/artifacts/v1.4r4/SHA256SUMS.txt
          cat q11_forensics/artifacts/v1.4r4/SHA256SUMS.txt

      - name: Upload V1.4R4 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: q11-cosmoflow-v1-4r4-replicate-${{ matrix.replicate }}
          path: q11_forensics/artifacts/v1.4r4/**
          if-no-files-found: error
          retention-days: 90
