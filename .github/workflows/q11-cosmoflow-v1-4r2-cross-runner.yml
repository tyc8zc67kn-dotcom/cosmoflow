name: Q11 CosmoFlow V1.4R2 Cross-Runner Reproducibility Audit

on:
  push:
    branches: [q11-cosmoflow-v1]
    paths:
      - 'Q11_COSMOFLOW_V1_4R2_PREREGISTRATION.md'
      - '.github/workflows/q11-cosmoflow-v1-4r2-cross-runner.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Q11_COSMOFLOW_V1_4R2_PREREGISTRATION.md'
      - '.github/workflows/q11-cosmoflow-v1-4r2-cross-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-runner:
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2, 3, 4]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.8.18
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.18'
          cache: pip
          cache-dependency-path: q11_cosmoflow/requirements-v1.1.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade 'pip<25'
          pip install -r q11_cosmoflow/requirements-v1.1.txt
          mkdir -p q11_forensics/cross-runner/${{ matrix.replicate }}
          pip freeze | sort > q11_forensics/cross-runner/${{ matrix.replicate }}/environment-freeze.txt
          uname -a > q11_forensics/cross-runner/${{ matrix.replicate }}/uname.txt
          lscpu > q11_forensics/cross-runner/${{ matrix.replicate }}/lscpu.txt

      - name: Execute existing forensic runner
        env:
          MPLBACKEND: Agg
        run: |
          set -o pipefail
          python q11_forensics/run_v1_4r_forensic.py | tee q11_forensics/cross-runner/${{ matrix.replicate }}/forensic.log
          cp q11_forensics/artifacts/v1.4r/forensic_report.json q11_forensics/cross-runner/${{ matrix.replicate }}/forensic_report.json
          cp q11_forensics/artifacts/v1.4r/run_a/raw_baseline.npz q11_forensics/cross-runner/${{ matrix.replicate }}/run_a_raw_baseline.npz
          cp q11_forensics/artifacts/v1.4r/run_b/raw_baseline.npz q11_forensics/cross-runner/${{ matrix.replicate }}/run_b_raw_baseline.npz

      - name: Freeze replicate hashes
        run: |
          cd q11_forensics/cross-runner/${{ matrix.replicate }}
          sha256sum forensic_report.json run_a_raw_baseline.npz run_b_raw_baseline.npz environment-freeze.txt uname.txt lscpu.txt forensic.log | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload replicate artifact
        uses: actions/upload-artifact@v4
        with:
          name: q11-cosmoflow-v1-4r2-replicate-${{ matrix.replicate }}
          path: q11_forensics/cross-runner/${{ matrix.replicate }}/**
          if-no-files-found: error
          retention-days: 90
