name: Q11 CosmoFlow V1.4R4B Lossless Canonical Binary Gate

on:
  push:
    branches: [q11-cosmoflow-v1]
    paths:
      - 'Q11_COSMOFLOW_V1_4R4B_PREREGISTRATION.md'
      - 'q11_cosmoflow/canonical/v1.1r/raw_baseline.npz'
      - 'q11_cosmoflow/canonical/v1.1r/CANONICAL_REFERENCE.md'
      - 'q11_forensics/run_v1_4r4b_lossless_gate.py'
      - '.github/workflows/q11-cosmoflow-v1-4r4b-gate.yml'
      - 'q11_cosmoflow/run_v1_1.py'
      - 'q11_cosmoflow/requirements-v1.1.txt'
      - 'CosmoFlow/Massless_dphi3/**'
  pull_request:
    branches: [main]
    paths:
      - 'Q11_COSMOFLOW_V1_4R4B_PREREGISTRATION.md'
      - 'q11_cosmoflow/canonical/v1.1r/raw_baseline.npz'
      - 'q11_cosmoflow/canonical/v1.1r/CANONICAL_REFERENCE.md'
      - 'q11_forensics/run_v1_4r4b_lossless_gate.py'
      - '.github/workflows/q11-cosmoflow-v1-4r4b-gate.yml'
      - 'q11_cosmoflow/run_v1_1.py'
      - 'q11_cosmoflow/requirements-v1.1.txt'
      - 'CosmoFlow/Massless_dphi3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lossless-canonical-binary-gate:
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2, 3, 4]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository-backed canonical binary
        uses: actions/checkout@v4

      - name: Verify canonical binary before dependency setup or decode
        run: |
          set -euo pipefail
          test -f q11_cosmoflow/canonical/v1.1r/raw_baseline.npz
          test "$(stat -c%s q11_cosmoflow/canonical/v1.1r/raw_baseline.npz)" = "19506"
          echo "b3247d19e54dda0652b77649e2c5826ed44b5c633ad8a6d15b0e96319eec84e1  q11_cosmoflow/canonical/v1.1r/raw_baseline.npz" | sha256sum -c -

      - name: Setup Python 3.8.18
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.18'
          cache: pip
          cache-dependency-path: q11_cosmoflow/requirements-v1.1.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade 'pip<25'
          pip install -r q11_cosmoflow/requirements-v1.1.txt
          mkdir -p q11_forensics/artifacts/v1.4r4b
          pip freeze | sort > q11_forensics/artifacts/v1.4r4b/environment-freeze.txt

      - name: Execute lossless canonical binary gate
        env:
          MPLBACKEND: Agg
        run: |
          set -o pipefail
          python q11_forensics/run_v1_4r4b_lossless_gate.py | tee q11_forensics/artifacts/v1.4r4b/run.log

      - name: Freeze V1.4R4B evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p q11_forensics/artifacts/v1.4r4b
          sha256sum q11_cosmoflow/canonical/v1.1r/raw_baseline.npz > q11_forensics/artifacts/v1.4r4b/CANONICAL_SHA256.txt
          if test -f q11_forensics/artifacts/v1.4r4b/lossless_gate_report.json; then
            sha256sum q11_forensics/artifacts/v1.4r4b/lossless_gate_report.json > q11_forensics/artifacts/v1.4r4b/REPORT_SHA256.txt
          fi
          if test -f q11_cosmoflow/artifacts/v1.1/raw_baseline.npz; then
            sha256sum q11_cosmoflow/artifacts/v1.1/raw_baseline.npz > q11_forensics/artifacts/v1.4r4b/CURRENT_SHA256.txt
          fi

      - name: Upload V1.4R4B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q11-cosmoflow-v1-4r4b-replicate-${{ matrix.replicate }}
          path: q11_forensics/artifacts/v1.4r4b/**
          if-no-files-found: error
          retention-days: 90
