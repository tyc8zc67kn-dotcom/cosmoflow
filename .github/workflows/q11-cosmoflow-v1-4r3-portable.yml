name: Q11 CosmoFlow V1.4R3 Portable Reproducibility Gate

on:
  push:
    branches: [q11-cosmoflow-v1]
    paths:
      - 'Q11_COSMOFLOW_V1_4R3_PREREGISTRATION.md'
      - 'q11_forensics/run_v1_4r3_portable_gate.py'
      - '.github/workflows/q11-cosmoflow-v1-4r3-portable.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Q11_COSMOFLOW_V1_4R3_PREREGISTRATION.md'
      - 'q11_forensics/run_v1_4r3_portable_gate.py'
      - '.github/workflows/q11-cosmoflow-v1-4r3-portable.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  portable-gate:
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2, 3, 4]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.18'
          cache: pip
          cache-dependency-path: q11_cosmoflow/requirements-v1.1.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade 'pip<25'
          pip install -r q11_cosmoflow/requirements-v1.1.txt
          mkdir -p q11_forensics/artifacts/v1.4r3
          pip freeze | sort > q11_forensics/artifacts/v1.4r3/environment-freeze.txt
      - name: Download canonical V1.1R artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p q11_forensics/reference_download q11_forensics/reference
          gh run download 32456990085 -n q11-cosmoflow-v1-1-baseline -D q11_forensics/reference_download
          cp q11_forensics/reference_download/q11_cosmoflow/artifacts/v1.1/raw_baseline.npz q11_forensics/reference/v1_1r_raw_baseline.npz
          echo 'b3247d19e54dda0652b77649e2c5826ed44b5c633ad8a6d15b0e96319eec84e1  q11_forensics/reference/v1_1r_raw_baseline.npz' | sha256sum -c -
      - name: Execute frozen portable gate
        env:
          Q11_REFERENCE_NPZ: ${{ github.workspace }}/q11_forensics/reference/v1_1r_raw_baseline.npz
        run: |
          python q11_forensics/run_v1_4r3_portable_gate.py | tee q11_forensics/artifacts/v1.4r3/run.log
      - name: Freeze artifact hashes
        run: |
          cd q11_forensics/artifacts/v1.4r3
          sha256sum raw_baseline.npz portable_gate_report.json environment-freeze.txt run.log | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: q11-cosmoflow-v1-4r3-replicate-${{ matrix.replicate }}
          path: q11_forensics/artifacts/v1.4r3/**
          if-no-files-found: error
          retention-days: 90
