name: Q11 CosmoFlow V1.5 Sensitivity Localization
on:
  push:
    branches: [q11-cosmoflow-v1]
    paths: ['Q11_COSMOFLOW_V1_5_PREREGISTRATION.md','q11_cosmoflow/run_v1_5.py','.github/workflows/q11-cosmoflow-v1-5.yml','q11_cosmoflow/requirements-v1.1.txt','CosmoFlow/Massless_dphi3/**']
permissions: {contents: read}
jobs:
  localize:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.8.18', cache: pip, cache-dependency-path: q11_cosmoflow/requirements-v1.1.txt}
      - run: pip install -r q11_cosmoflow/requirements-v1.1.txt
      - env: {MPLBACKEND: Agg}
        run: |
          mkdir -p q11_cosmoflow/artifacts/v1.5
          set -o pipefail
          python q11_cosmoflow/run_v1_5.py | tee q11_cosmoflow/artifacts/v1.5/run.log
      - run: |
          cd q11_cosmoflow/artifacts/v1.5
          sha256sum scores.csv summary.json run.log | sort > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: q11-cosmoflow-v1-5-sensitivity-localization
          path: q11_cosmoflow/artifacts/v1.5/**
          if-no-files-found: error
          retention-days: 90
