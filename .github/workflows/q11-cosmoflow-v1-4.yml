name: Q11 CosmoFlow V1.4 Out-of-Sample Audit
on:
  push:
    branches: [q11-cosmoflow-v1]
    paths: ['Q11_COSMOFLOW_V1_4_PREREGISTRATION.md', 'q11_cosmoflow/run_v1_4.py', '.github/workflows/q11-cosmoflow-v1-4.yml', 'q11_cosmoflow/requirements-v1.1.txt', 'CosmoFlow/Massless_dphi3/**']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.8.18', cache: pip, cache-dependency-path: q11_cosmoflow/requirements-v1.1.txt}
      - run: |
          python -m pip install --upgrade 'pip<25'
          pip install -r q11_cosmoflow/requirements-v1.1.txt
          pip freeze | sort > q11_cosmoflow/environment-freeze-v1.4.txt
      - env: {MPLBACKEND: Agg}
        run: |
          mkdir -p q11_cosmoflow/artifacts/v1.4
          set -o pipefail
          python q11_cosmoflow/run_v1_4.py | tee q11_cosmoflow/artifacts/v1.4/run.log
      - run: |
          cd q11_cosmoflow/artifacts/v1.4
          sha256sum *_raw.npz scores.csv summary.json run.log | sort > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: q11-cosmoflow-v1-4-out-of-sample-audit
          path: |
            q11_cosmoflow/artifacts/v1.4/**
            q11_cosmoflow/environment-freeze-v1.4.txt
            Q11_COSMOFLOW_V1_4_PREREGISTRATION.md
          if-no-files-found: error
          retention-days: 90
