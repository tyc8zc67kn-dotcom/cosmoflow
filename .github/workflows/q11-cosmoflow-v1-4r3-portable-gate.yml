name: Q11 CosmoFlow V1.4R3 Portable Reproducibility Gate

on:
  push:
    branches: [q11-cosmoflow-v1]
    paths:
      - 'Q11_COSMOFLOW_V1_4R3_PREREGISTRATION.md'
      - 'q11_forensics/run_v1_4r3_portable_gate.py'
      - '.github/workflows/q11-cosmoflow-v1-4r3-portable-gate.yml'
      - 'q11_cosmoflow/run_v1_1.py'
      - 'q11_cosmoflow/requirements-v1.1.txt'
      - 'CosmoFlow/Massless_dphi3/**'
  pull_request:
    branches: [main]
    paths:
      - 'Q11_COSMOFLOW_V1_4R3_PREREGISTRATION.md'
      - 'q11_forensics/run_v1_4r3_portable_gate.py'
      - '.github/workflows/q11-cosmoflow-v1-4r3-portable-gate.yml'
      - 'q11_cosmoflow/run_v1_1.py'
      - 'q11_cosmoflow/requirements-v1.1.txt'
      - 'CosmoFlow/Massless_dphi3/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  portable-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.8.18
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.18'
          cache: pip
          cache-dependency-path: q11_cosmoflow/requirements-v1.1.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade 'pip<25'
          pip install -r q11_cosmoflow/requirements-v1.1.txt
          pip freeze | sort > q11_forensics/environment-freeze-v1.4r3.txt

      - name: Fetch and verify canonical V1.1R reference artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p q11_forensics/reference_v1.1r
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9437578374/zip" \
            -o /tmp/q11-v1.1r-reference.zip
          unzip -q /tmp/q11-v1.1r-reference.zip -d q11_forensics/reference_v1.1r
          test -f q11_forensics/reference_v1.1r/artifacts/v1.1/raw_baseline.npz
          echo "b3247d19e54dda0652b77649e2c5826ed44b5c633ad8a6d15b0e96319eec84e1  q11_forensics/reference_v1.1r/artifacts/v1.1/raw_baseline.npz" | sha256sum -c -

      - name: Execute prospective portable gate
        env:
          MPLBACKEND: Agg
          Q11_REFERENCE_NPZ: ${{ github.workspace }}/q11_forensics/reference_v1.1r/artifacts/v1.1/raw_baseline.npz
        run: |
          set -o pipefail
          python q11_forensics/run_v1_4r3_portable_gate.py | tee q11_forensics/v1.4r3-portable-gate.log

      - name: Freeze audit artifacts
        run: |
          mkdir -p q11_forensics/artifacts/v1.4r3
          sha256sum \
            q11_forensics/artifacts/v1.4r3/portable_gate_report.json \
            q11_forensics/environment-freeze-v1.4r3.txt \
            q11_forensics/v1.4r3-portable-gate.log \
            q11_forensics/reference_v1.1r/artifacts/v1.1/raw_baseline.npz \
            q11_cosmoflow/artifacts/v1.1/raw_baseline.npz \
            | sort > q11_forensics/artifacts/v1.4r3/SHA256SUMS.txt
          cat q11_forensics/artifacts/v1.4r3/SHA256SUMS.txt

      - name: Upload V1.4R3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: q11-cosmoflow-v1-4r3-portable-gate
          path: |
            q11_forensics/artifacts/v1.4r3/**
            q11_forensics/environment-freeze-v1.4r3.txt
            q11_forensics/v1.4r3-portable-gate.log
            q11_forensics/reference_v1.1r/artifacts/v1.1/raw_baseline.npz
            q11_cosmoflow/artifacts/v1.1/raw_baseline.npz
            Q11_COSMOFLOW_V1_4R3_PREREGISTRATION.md
          if-no-files-found: error
          retention-days: 90
