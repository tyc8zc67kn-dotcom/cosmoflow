name: Q11 CosmoFlow V1.4R Reproducibility Forensic Audit

on:
  push:
    branches: [q11-cosmoflow-v1]
    paths:
      - 'Q11_COSMOFLOW_V1_4R_PREREGISTRATION.md'
      - 'q11_forensics/**'
      - '.github/workflows/q11-cosmoflow-v1-4r-forensic.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Q11_COSMOFLOW_V1_4R_PREREGISTRATION.md'
      - 'q11_forensics/**'
      - '.github/workflows/q11-cosmoflow-v1-4r-forensic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.8.18
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.18'
          cache: pip
          cache-dependency-path: q11_cosmoflow/requirements-v1.1.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade 'pip<25'
          pip install -r q11_cosmoflow/requirements-v1.1.txt
          pip freeze | sort > q11_forensics/environment-freeze-v1.4r.txt

      - name: Execute forensic audit without changing existing runners
        env:
          MPLBACKEND: Agg
        run: |
          set -o pipefail
          python q11_forensics/run_v1_4r_forensic.py | tee q11_forensics/v1.4r-forensic.log

      - name: SHA256 freeze
        run: |
          cd q11_forensics
          sha256sum artifacts/v1.4r/run_a/raw_baseline.npz \
                    artifacts/v1.4r/run_b/raw_baseline.npz \
                    artifacts/v1.4r/forensic_report.json \
                    environment-freeze-v1.4r.txt \
                    v1.4r-forensic.log | sort > artifacts/v1.4r/SHA256SUMS.txt
          cat artifacts/v1.4r/SHA256SUMS.txt

      - name: Upload V1.4R forensic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: q11-cosmoflow-v1-4r-forensic-audit
          path: |
            q11_forensics/artifacts/v1.4r/**
            q11_forensics/environment-freeze-v1.4r.txt
            q11_forensics/v1.4r-forensic.log
            Q11_COSMOFLOW_V1_4R_PREREGISTRATION.md
          if-no-files-found: error
          retention-days: 90
